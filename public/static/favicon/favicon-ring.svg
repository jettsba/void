<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <style>
    .r { stroke: #fff; }
    .g { opacity: .75; }
    @media (prefers-color-scheme: light) {
      .r { stroke: #111; }
      .g { opacity: .3; }
    }
  </style>
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.2"/>
    </filter>
  </defs>
  <circle class="r g" cx="32" cy="32" r="21" fill="none" stroke-width="7" filter="url(#glow)"/>
  <circle class="r" cx="32" cy="32" r="21" fill="none" stroke-width="4.5"/>
</svg>
