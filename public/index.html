<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>void web :: peer-to-peer voice rooms </title>
    <meta name="description" content="void — ephemeral voice rooms. P2P, без аккаунтов, без истории.">
    <meta name="theme-color" content="#0a0a0b">
    <meta name="robots" content="noindex,nofollow">

    <meta property="og:type"        content="website">
    <meta property="og:site_name"   content="void">
    <meta property="og:title"       content="void — voice rooms">
    <meta property="og:description" content="ephemeral voice spaces. no accounts. no history. P2P.">
    <meta property="og:url"         content="https://void-room.space">
    <meta property="og:image"       content="https://void-room.space/static/favicon/web-app-manifest-512x512.png">

    <meta name="twitter:card"        content="summary">
    <meta name="twitter:title"       content="void — voice rooms">
    <meta name="twitter:description" content="ephemeral voice spaces. no accounts. no history. P2P.">
    <meta name="twitter:image"       content="https://void-room.space/static/favicon/web-app-manifest-512x512.png">

    <!-- UI scale bootstrap. Внешний файл (а не inline) чтобы не требовать
         'unsafe-inline' в CSP. Блокирующий script — должен выполниться ДО
         CSS, иначе FOUC на больших мониторах. -->
    <script src="ui-scale-bootstrap.js?v=1"></script>

    <link rel="stylesheet" href="css/base.css?v=21">
    <link rel="stylesheet" href="css/intro.css?v=18">
    <link rel="stylesheet" href="css/app.css?v=18">
    <link rel="stylesheet" href="css/header.css?v=18">
    <link rel="stylesheet" href="css/stage.css?v=21">
    <link rel="stylesheet" href="css/panel.css?v=23">
    <link rel="stylesheet" href="css/volume-arc.css?v=18">
    <link rel="stylesheet" href="css/ping.css?v=18">
    <link rel="stylesheet" href="css/chat.css?v=21">
    <link rel="stylesheet" href="css/chat-attach.css?v=18">
    <link rel="stylesheet" href="css/chat-overlay.css?v=18">
    <link rel="stylesheet" href="css/screencast.css?v=19">
    <link rel="stylesheet" href="css/responsive.css?v=21">
    <link rel="stylesheet" href="css/settings.css?v=30">

<link rel="icon" type="image/png" href="/static/favicon/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/static/favicon/favicon.svg" />
    <link rel="shortcut icon" href="/static/favicon/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/static/favicon/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Void" />
    <!-- iOS PWA: при добавлении на home screen открывать в standalone-режиме
         (без Safari chrome) и держать тёмный translucent status bar — иначе
         поверх ambient-фона нарисуется белая полоса. v0.9.21 (M5.4). -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="/static/favicon/site.webmanifest" />
</head>

<body>
    <canvas id="background"></canvas>
    <canvas id="background-stars"></canvas>
    <div id="background-grain"></div>

    <audio id="ambientSound" src="static/ambient.mp3"></audio>
    <audio id="welcomeSound" src="static/welcome.mp3"></audio>
    <audio id="joinSound" src="static/audio-in.mp3"></audio>
    <audio id="leaveSound" src="static/audio-out.mp3"></audio>
    <audio id="messageSound" src="static/message.mp3" preload="auto"></audio>

    <div class="intro" id="intro">
        <div class="intro-content">
            <h1 class="intro-title" id="introTitle">
                <span class="intro-title-text" id="introTitleText"></span><span class="intro-cursor" id="introCursor"
                    aria-hidden="true">|</span>
            </h1>
            <form class="intro-field" id="introForm" novalidate>
                <input type="text" id="introInput" class="intro-input"
                    autocomplete="off" spellcheck="false"
                    inputmode="text" enterkeyhint="go" disabled />
                <button type="submit" class="intro-submit-btn" id="introSubmitBtn" aria-label="submit">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M9 6l6 6-6 6" />
                    </svg>
                </button>
                <div class="intro-error" id="introError" aria-live="polite">+</div>
            </form>
        </div>
    </div>

    <div class="app hidden-start" id="app" data-mode="entry">
        <header class="header">
            <div class="brand">
                <button type="button" class="brand-lockup" id="brandSettingsBtn"
                    aria-haspopup="dialog" aria-expanded="false"
                    data-i18n-attr="aria-label:header.settings;title:header.settings">
                    <span class="brand-logo" aria-hidden="true">
                        <span class="logo-eclipse"></span>
                        <svg class="brand-gear" viewBox="0 0 24 24" aria-hidden="true">
                            <path
                                d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 0 0 2.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 0 0 1.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 0 0-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 0 0-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 0 0-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 0 0-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 0 0 1.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
                            <circle cx="12" cy="12" r="3" />
                        </svg>
                    </span>
                    <span class="brand-mark">void</span>
                </button>
            </div>
            <button type="button" class="chat-toggle" id="chatToggleBtn" title="show chat" aria-pressed="false"
                aria-expanded="false" aria-controls="chatPanel">
                <span class="chat-toggle-stack" aria-hidden="true">
                    <span class="chat-toggle-pane chat-toggle-pane--idle">
                        <svg class="chat-toggle-icon-svg" viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M4 5h16v11H8l-4 4V5z" />
                            <circle class="chat-toggle-dot" cx="9" cy="11" r="1.35" />
                            <circle class="chat-toggle-dot" cx="13" cy="11" r="1.35" />
                            <circle class="chat-toggle-dot" cx="17" cy="11" r="1.35" />
                        </svg>
                        <span class="chat-toggle-label" data-i18n="header.chat.label.idle">chat</span>
                    </span>
                    <span class="chat-toggle-pane chat-toggle-pane--open">
                        <svg class="chat-toggle-icon-svg" viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M6 6l12 12" />
                            <path d="M18 6L6 18" />
                        </svg>
                        <span class="chat-toggle-label" data-i18n="header.chat.label.open">close</span>
                    </span>
                </span>
                <span class="chat-toggle-badge" id="chatToggleBadge" aria-hidden="true"></span>
            </button>
        </header>

        <main class="stage">
            <div class="stage-stack">

                <!-- ТОЧКА A: пользователи. Ripple и аватар центрируются в одну точку. -->
                <div class="users-area" id="room">
                    <div class="users-slot">
                        <div class="lobby-ripple" aria-hidden="true">
                            <span class="lobby-ripple-ring"></span>
                            <span class="lobby-ripple-ring"></span>
                        </div>
                        <div class="participants" id="participants"></div>
                        <span class="sr-only" id="roomHint" role="status" aria-live="polite" data-i18n="room.empty">no one here yet</span>
                    </div>
                </div>

                <!-- ТОЧКА B: панель. Фикс высоты, top:0 у обоих слоёв — input и controls на одной точке. -->
                <div class="panel-area">
                    <div class="panel-input">
                        <!-- Entry-флоу ошибки (mic-blocked, room-not-found, code-taken,
                             connection-failed/lost, rate-limited и т.п.) живут ВНУТРИ
                             panel-input, над полем кода — это контекстная ошибка про
                             действие «войти», она должна быть рядом с инпутом, а не в
                             общем toast-host над футером (v0.9.17). -->
                        <div class="entry-error-toast" id="entryError" role="status" aria-live="polite"
                            aria-hidden="true">
                            <span class="entry-error-glyph" aria-hidden="true">×</span>
                            <span class="entry-error-msg" id="entryErrorText"></span>
                        </div>
                        <form class="entry-actions" id="entryForm" novalidate>
                            <div class="entry-code-field">
                                <span class="entry-hash" aria-hidden="true">#</span>
                                <input type="text" class="entry-code" id="codeInput" maxlength="5"
                                    placeholder="enter code" data-i18n-placeholder="entry.placeholder"
                                    autocomplete="off" spellcheck="false"
                                    inputmode="text" enterkeyhint="go" />
                            </div>
                            <button type="submit" class="btn primary" id="joinBtn" data-i18n="entry.join">join</button>
                        </form>
                    </div>

                    <div class="panel-controls" id="controls">
                        <button type="button" class="control-btn" id="micBtn" title="mute"
                            data-i18n-attr="title:controls.mute">
                            <svg viewBox="0 0 24 24" aria-hidden="true">
                                <rect x="9" y="3" width="6" height="12" rx="3" />
                                <path d="M5 11a7 7 0 0 0 14 0" />
                                <path d="M12 18v3" />
                                <line class="strike-bg" x1="20" y1="4" x2="4" y2="20" />
                                <line class="strike" x1="20" y1="4" x2="4" y2="20" />
                            </svg>
                        </button>
                        <button type="button" class="control-btn" id="soundBtn" title="deaf"
                            data-i18n-attr="title:controls.deaf">
                            <svg viewBox="0 0 24 24" aria-hidden="true">
                                <path d="M4 9v6h4l5 4V5L8 9H4z" />
                                <path class="wave" d="M16 8a5 5 0 0 1 0 8" />
                                <line class="strike-bg" x1="20" y1="4" x2="4" y2="20" />
                                <line class="strike" x1="20" y1="4" x2="4" y2="20" />
                            </svg>
                        </button>
                        <button type="button" class="control-btn control-btn-stub" id="screencastBtn"
                            title="screencast (soon)" data-i18n-attr="title:controls.screencast.soon"
                            aria-disabled="true">
                            <span class="sc-btn-icon sc-btn-icon--idle" aria-hidden="true">
                                <svg viewBox="0 0 24 24">
                                    <rect x="3" y="4" width="18" height="13" rx="2.5" />
                                    <path d="M10 14 L15 9" />
                                    <path d="M11 9 H15 V13" />
                                    <path d="M8 20 H16" />
                                </svg>
                            </span>
                            <span class="sc-btn-icon sc-btn-icon--stop" aria-hidden="true">
                                <svg viewBox="0 0 24 24">
                                    <rect x="3" y="4" width="18" height="13" rx="2.5" />
                                    <path d="M8 20 H16" />
                                    <line x1="9.5" y1="8" x2="14.5" y2="13" />
                                    <line x1="14.5" y1="8" x2="9.5" y2="13" />
                                </svg>
                            </span>
                        </button>
                        <button type="button" class="leave-btn" id="leaveBtn" data-i18n="controls.leave">leave</button>
                    </div>

                    <div class="panel-tail">
                        <div class="entry-divider" data-i18n="entry.or">or</div>
                        <button type="button" class="btn ghost" id="createBtn" data-i18n="entry.create">open a new room →</button>
                    </div>
                </div>

            </div>
        </main>

        <aside class="chat-panel" id="chatPanel" aria-hidden="true" aria-label="room chat" inert>
            <div class="chat-panel-inner">
                <header class="chat-header">
                    <span class="chat-title" data-i18n="chat.title">chat</span>
                </header>

                <div class="chat-messages" id="chatMessages" role="log" aria-live="polite"></div>

                <button type="button" class="chat-jump-bottom" id="chatJumpBtn" title="jump to newest"
                    aria-label="jump to newest" aria-hidden="true"
                    data-i18n-attr="title:chat.jump;aria-label:chat.jump">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M12 17V5" />
                        <path d="M6 12l6 6 6-6" />
                    </svg>
                </button>

                <div class="chat-empty" id="chatEmpty">
                    <span data-i18n="chat.empty">no messages yet</span>
                </div>

                <div class="chat-pending" id="chatPending" hidden></div>

                <div class="chat-toast" id="chatToast" aria-live="polite"></div>

                <div class="chat-input-row">
                    <button type="button" class="chat-attach-btn" id="chatAttachBtn" title="attach file"
                        aria-label="attach"
                        data-i18n-attr="title:chat.attach.full;aria-label:chat.attach">
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path
                                d="M21.44 11.05L12.25 20.24a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66L9.41 17.41a2 2 0 0 1-2.83-2.83l8.49-8.49" />
                        </svg>
                    </button>
                    <textarea id="chatInput" class="chat-input" placeholder="message…"
                        data-i18n-placeholder="chat.placeholder" rows="1" maxlength="2000"
                        autocomplete="off" spellcheck="false"></textarea>
                    <button type="button" class="chat-send" id="chatSendBtn" title="send" aria-label="send"
                        data-i18n-attr="title:chat.send;aria-label:chat.send">
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M5 12h14" />
                            <path d="M13 6l6 6-6 6" />
                        </svg>
                    </button>
                </div>

                <input type="file" id="chatFileInput" hidden multiple />
            </div>
        </aside>

        <div class="chat-drop-overlay" id="chatDropOverlay" aria-hidden="true">
            <div class="chat-drop-overlay-inner">
                <span class="chat-drop-overlay-text" data-i18n="chat.drop">drop to attach</span>
            </div>
        </div>

        <div class="chat-lightbox" id="chatLightbox" aria-hidden="true" role="dialog" aria-label="image preview"
            data-i18n-attr="aria-label:chat.lightbox">
            <img class="chat-lightbox-img" id="chatLightboxImg" alt="" />
            <button type="button" class="chat-lightbox-close" id="chatLightboxClose" title="close" aria-label="close"
                data-i18n-attr="title:chat.close;aria-label:chat.close">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M6 6l12 12" />
                    <path d="M18 6L6 18" />
                </svg>
            </button>
        </div>

        <footer class="footer footer-meta">
            <span class="conn-state" id="connState" role="button" tabindex="0">
                <span class="conn-dot" id="connDot"></span>
                <span id="connLabel">ready</span>
                <div class="ping-panel" id="pingPanel" aria-hidden="true">
                    <div class="ping-panel-list" id="pingPanelList"></div>
                </div>
            </span>
            <span class="footer-divider">·</span>
            <div class="room-info hidden" id="roomInfo" role="button" tabindex="0"
                aria-haspopup="true" aria-expanded="false"
                title="пригласить" data-i18n-attr="title:invite.button-title">
                <span class="room-code-view">
                    <span id="roomCodeText" class="room-code-panel">room #XXXXX</span>
                </span>
                <div class="invite-panel" id="invitePanel" aria-hidden="true" role="menu">
                    <div class="invite-code-row" id="inviteCopyCode" role="button" tabindex="0">
                        <span class="invite-code-row-label" data-i18n="invite.code-label">комната:</span>
                        <span class="invite-code-row-value" id="inviteCodeValue">XXXXX</span>
                        <span class="invite-row-copied" data-i18n="invite.copied">скопировано</span>
                    </div>
                    <button class="invite-link-btn" id="inviteCopyLink" type="button">
                        <span class="invite-link-btn-inner">
                            <svg class="invite-link-btn-icon" viewBox="0 0 24 24" aria-hidden="true">
                                <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71" />
                                <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71" />
                            </svg>
                            <span class="invite-link-btn-label" data-i18n="invite.copy-link">скопировать ссылку</span>
                        </span>
                        <span class="invite-row-copied" data-i18n="invite.copied">скопировано</span>
                    </button>
                </div>
            </div>
        </footer>
    </div>

    <!-- Микрофон заблокирован: sticky-диалог с инструкцией. Закрывается
         кнопкой / Esc / кликом по backdrop. См. U1 в tasks/audit.md. -->
    <div class="mic-blocked-modal" id="micBlockedModal" aria-hidden="true" inert role="dialog"
        aria-labelledby="micBlockedTitle">
        <div class="mic-blocked-backdrop" id="micBlockedBackdrop"></div>
        <div class="mic-blocked-card">
            <div class="mic-blocked-glyph" aria-hidden="true">
                <svg viewBox="0 0 24 24">
                    <rect x="9" y="3" width="6" height="12" rx="3" />
                    <path d="M5 11a7 7 0 0 0 14 0" />
                    <path d="M12 18v3" />
                    <line class="strike-bg" x1="20" y1="4" x2="4" y2="20" />
                    <line class="strike" x1="20" y1="4" x2="4" y2="20" />
                </svg>
            </div>
            <h2 class="mic-blocked-title" id="micBlockedTitle" data-i18n="errors.mic-blocked.title">микрофон заблокирован</h2>
            <p class="mic-blocked-body" data-i18n="errors.mic-blocked.body">нажми на иконку микрофона в адресной строке и разреши доступ - после чего обнови страницу. </p>
            <button type="button" class="mic-blocked-cta" id="micBlockedClose" data-i18n="errors.mic-blocked.cta">понятно</button>
        </div>
    </div>

    <div class="sc-modal" id="scModal" aria-hidden="true" inert role="dialog" aria-label="screen sharing settings"
        data-i18n-attr="aria-label:screencast.title">
        <div class="sc-modal-backdrop"></div>
        <div class="sc-modal-content">
            <span class="sc-modal-title" data-i18n="screencast.title">screen share</span>

            <div class="sc-section">
                <span class="sc-section-label" data-i18n="screencast.resolution">resolution</span>
                <div class="sc-tiles" id="scRes">
                    <button class="sc-tile" data-val="480">
                        <span class="sc-tile-num">480</span>
                        <span class="sc-tile-sub">p</span>
                    </button>
                    <button class="sc-tile" data-val="720">
                        <span class="sc-tile-num">720</span>
                        <span class="sc-tile-sub">p</span>
                    </button>
                    <button class="sc-tile sc-tile--active" data-val="1080">
                        <span class="sc-tile-num">1080</span>
                        <span class="sc-tile-sub">p</span>
                    </button>
                </div>
            </div>

            <div class="sc-section">
                <span class="sc-section-label" data-i18n="screencast.fps">frame rate</span>
                <div class="sc-tiles" id="scFps">
                    <button class="sc-tile sc-tile--active" data-val="30">
                        <span class="sc-tile-num">30</span>
                        <span class="sc-tile-sub">fps</span>
                    </button>
                    <button class="sc-tile" data-val="60">
                        <span class="sc-tile-num">60</span>
                        <span class="sc-tile-sub">fps</span>
                    </button>
                </div>
            </div>

            <div class="sc-section sc-section--row">
                <span class="sc-section-label" data-i18n="screencast.audio">screen audio</span>
                <label class="sc-switch">
                    <input type="checkbox" id="scAudio" />
                    <span class="sc-switch-track"></span>
                </label>
            </div>

            <button class="sc-next-btn" id="scNextBtn" data-i18n="screencast.next">next →</button>
        </div>
    </div>

    <div class="screen-overlay" id="screenOverlay" aria-hidden="true" inert role="dialog" aria-label="screen share"
        data-i18n-attr="aria-label:screencast.title">
        <button class="screen-overlay-close" id="screenOverlayClose" aria-label="close"
            data-i18n-attr="aria-label:chat.close">&#x2715;</button>
        <video class="screen-overlay-video" id="screenOverlayVideo" autoplay playsinline></video>
        <button class="screen-overlay-fullscreen" id="screenOverlayFullscreen" aria-label="fullscreen"
            data-i18n-attr="aria-label:screencast.fullscreen">
            <svg class="icon-expand" viewBox="0 0 24 24" aria-hidden="true">
                <path
                    d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3" />
            </svg>
            <svg class="icon-collapse" viewBox="0 0 24 24" aria-hidden="true">
                <path
                    d="M3 8h3a2 2 0 0 0 2-2V3M16 3v3a2 2 0 0 0 2 2h3M21 16h-3a2 2 0 0 0-2 2v3M8 21v-3a2 2 0 0 0-2-2H3" />
            </svg>
        </button>
    </div>

    <script defer src="log.js"></script>
    <script defer src="settings.js?v=27"></script>
    <script defer src="webrtc.js"></script>
    <script defer src="socket.js"></script>
    <script defer src="chat.js?v=2"></script>
    <script defer src="js/config.js?v=2"></script>
    <script defer src="js/state.js?v=4"></script>
    <script defer src="js/toasts.js?v=1"></script>
    <script defer src="js/background.js?v=7"></script>
    <script defer src="js/audio.js?v=1"></script>
    <script defer src="js/username.js?v=1"></script>
    <script defer src="js/controls.js?v=1"></script>
    <script defer src="js/participants.js?v=3"></script>
    <script defer src="js/volume-arc.js?v=1"></script>
    <script defer src="js/ping-panel.js?v=2"></script>
    <script defer src="js/screen-overlay.js?v=3"></script>
    <script defer src="js/intro.js?v=3"></script>
    <script defer src="js/room.js?v=4"></script>
    <script defer src="js/app.js?v=8"></script>
</body>

</html>
