<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>void</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
    <link rel="icon" href="static/favicon.ico" type="image/x-icon">
</head>
<body>
<canvas id="background"></canvas>

<audio id="ambientSound" src="static/ambient.mp3"></audio>
<audio id="welcomeSound" src="static/welcome.mp3"></audio>
<audio id="joinSound" src="static/audio-in.mp3"></audio>
<audio id="leaveSound" src="static/audio-out.mp3"></audio>

<div class="intro" id="intro">
    <div class="intro-content">
        <h1 class="intro-title" id="introTitle">
            <span class="intro-title-text" id="introTitleText"></span><span class="intro-cursor" id="introCursor" aria-hidden="true">|</span>
        </h1>
        <div class="intro-field">
            <input type="text" id="introInput" class="intro-input" autocomplete="off" disabled />
            <div class="intro-error" id="introError" aria-live="polite">+</div>
        </div>
    </div>
</div>

<div class="app hidden-start" id="app" data-mode="entry">
    <header class="header">
        <div class="brand">
            <span class="brand-lockup">
                <span class="logo-eclipse" aria-hidden="true"></span>
                <span class="brand-mark">void</span>
            </span>
        </div>
    </header>

    <main class="stage">
        <div class="stage-stack">

            <!-- ТОЧКА A: пользователи. Ripple и аватар центрируются в одну точку. -->
            <div class="users-area" id="room">
                <div class="users-slot">
                    <div class="lobby-ripple" aria-hidden="true">
                        <span class="lobby-ripple-ring"></span>
                        <span class="lobby-ripple-ring"></span>
                    </div>
                    <div class="participants" id="participants"></div>
                    <span class="sr-only" id="roomHint" role="status" aria-live="polite">no one here yet</span>
                </div>
            </div>

            <!-- ТОЧКА B: панель. Фикс высоты, top:0 у обоих слоёв — input и controls на одной точке. -->
            <div class="panel-area">
                <div class="panel-input">
                    <div class="entry-error-toast" id="entryError" role="status" aria-live="polite" aria-hidden="true">
                        <span class="entry-error-glyph" aria-hidden="true">×</span>
                        <span class="entry-error-msg" id="entryErrorText"></span>
                    </div>
                    <div class="entry-actions">
                        <div class="entry-code-field">
                            <span class="entry-hash" aria-hidden="true">#</span>
                            <input
                                type="text"
                                class="entry-code"
                                id="codeInput"
                                maxlength="5"
                                placeholder="enter code"
                                autocomplete="off"
                                spellcheck="false"
                            />
                        </div>
                        <button type="button" class="btn primary" id="joinBtn">join</button>
                    </div>
                </div>

                <div class="panel-controls" id="controls">
                    <button type="button" class="control-btn" id="micBtn" title="mute">
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <rect x="9" y="3" width="6" height="12" rx="3"/>
                            <path d="M5 11a7 7 0 0 0 14 0"/>
                            <path d="M12 18v3"/>
                            <line class="strike-bg" x1="20" y1="4" x2="4" y2="20"/>
                            <line class="strike" x1="20" y1="4" x2="4" y2="20"/>
                        </svg>
                    </button>
                    <button type="button" class="control-btn" id="soundBtn" title="deaf">
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M4 9v6h4l5 4V5L8 9H4z"/>
                            <path class="wave" d="M16 8a5 5 0 0 1 0 8"/>
                            <line class="strike-bg" x1="20" y1="4" x2="4" y2="20"/>
                            <line class="strike" x1="20" y1="4" x2="4" y2="20"/>
                        </svg>
                    </button>
                    <button type="button" class="control-btn control-btn-stub" id="screencastBtn" title="screencast (soon)" aria-disabled="true">
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <rect x="3" y="4" width="18" height="13" rx="2.5"/>
                            <path d="M10 14 L15 9"/>
                            <path d="M11 9 H15 V13"/>
                            <path d="M8 20 H16"/>
                        </svg>
                    </button>
                    <button type="button" class="leave-btn" id="leaveBtn">leave</button>
                </div>

                <div class="panel-tail">
                    <div class="entry-divider">or</div>
                    <button type="button" class="btn ghost" id="createBtn">open a new room →</button>
                </div>
            </div>

        </div>
    </main>

    <footer class="footer footer-meta">
        <span class="conn-state">
            <span class="conn-dot" id="connDot"></span>
            <span id="connLabel">ready</span>
        </span>
        <span class="footer-divider">·</span>
        <div class="room-info hidden" id="roomInfo" title="copy code">
            <span class="room-code-view">
                <span id="roomCodeText" class="room-code-panel room-code-panel--code">room #XXXXX</span>
                <span class="room-code-panel room-code-panel--copied" aria-hidden="true">copied!</span>
            </span>
        </div>
    </footer>
</div>

<script src="webrtc.js"></script>
<script src="socket.js"></script>
<script src="script.js"></script>
</body>
</html>
