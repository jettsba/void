<!doctype html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>обновление void</title>
    <link rel="stylesheet" href="css/updater-window.css" />
</head>
<body>
    <!-- Окно тихого обновления (режим A). Стиль — variant signal / шаг «установка»
         из design_handoff/VOID_INSTALLER_HANDOFF.md. Управляется событиями из Rust:
         void:upd-begin / void:upd-progress / void:upd-phase / void:upd-error. -->
    <div class="uw-root">
        <main class="uw-body">
            <div class="uw-content">
                <div class="uw-eyebrow">обновление void</div>

                <!-- ВАЖНО: спаны бара — одной строкой без отступов. У .uw-bar
                     стоит white-space: pre, поэтому любой перенос/пробел из
                     исходника отрендерится буквально и сдвинет бар. -->
                <div class="uw-bar"><span class="uw-bar-br">[</span><span class="uw-bar-fill" id="uwBarFill"></span><span class="uw-bar-empty" id="uwBarEmpty"></span><span class="uw-bar-br">]</span><span class="uw-bar-pct" id="uwPct">0%</span></div>

                <div class="uw-divider"></div>
                <div class="uw-log" id="uwLog"></div>
            </div>
            <div class="uw-vignette" aria-hidden="true"></div>
        </main>
    </div>

    <script src="js/desktop/updater-window.js" defer></script>
</body>
</html>
