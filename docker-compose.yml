services:
  void:
    build: .
    container_name: void-room
    restart: unless-stopped
    # init:true — корректный signal handler под PID 1: SIGTERM из docker
    # доходит до node-процесса, graceful shutdown отрабатывает.
    init: true
    ports:
      # Только localhost: снаружи доступ через Caddy (80/443).
      - "127.0.0.1:3000:3000"
    environment:
      # Пароль для GET /adminstats. Если не задан — endpoint вернёт 503
      # «disabled», панель останется недоступной даже без файрвола.
      - ADMIN_STATS_PASSWORD=${ADMIN_STATS_PASSWORD:-}
      # Уровень логов: error | warn | info | debug (дефолт info).
      # На проде info — это нормальная плотность (комнаты + security-события).
      # debug — когда отлаживаешь баг и нужно видеть все коннекты/дисконнекты.
      - LOG_LEVEL=${LOG_LEVEL:-info}
      # Список разрешённых origin'ов через запятую. Пустое = дефолт
      # из lib/security.js (void-room.space). Меняешь домен — меняешь сюда,
      # код не трогаешь.
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-https://void-room.space,https://www.void-room.space,https://app.void-room.space}
      # В контейнере слушаем все интерфейсы (Caddy ходит по localhost моста).
      # Вне контейнера дефолт — 127.0.0.1, чтобы случайный `node server.js`
      # на VPS не выставлял голый node наружу.
      - BIND_HOST=0.0.0.0
      # Лимит участников в комнате.
      - MAX_ROOM_USERS=${MAX_ROOM_USERS:-5}
      # Yandex SMTP для багрепортов (POST /api/report-bug). Если USER или PASS
      # пусты — endpoint вернёт 503 «not configured», UI покажет «не удалось
      # отправить». Конфиг полностью на стороне сервера, клиент кредов не видит.
      # BUG_SMTP_TO опционален — дефолт = BUG_SMTP_USER (письмо себе).
      - BUG_SMTP_USER=${BUG_SMTP_USER:-}
      - BUG_SMTP_PASS=${BUG_SMTP_PASS:-}
      - BUG_SMTP_TO=${BUG_SMTP_TO:-}
      # TURN endpoint (GET /api/turn-credentials) выдаёт клиенту HMAC-подписанные
      # короткие credentials для coturn-сервиса ниже. Если TURN_HOST / TURN_SECRET
      # пусты — endpoint возвращает 503, клиент работает только со STUN (legacy
      # режим). Эти же значения используются coturn (как static-auth-secret).
      - TURN_HOST=${TURN_HOST:-}
      - TURN_SECRET=${TURN_SECRET:-}
    volumes:
      # Персистентная статистика beta-теста: stats.json лежит на хосте
      # и переживает docker compose up --build / restart. Папка ./data
      # создаётся автоматически на первом запуске.
      - ./data:/app/data
    # read_only + tmpfs:/tmp — рантайм неизменяем, что отрезает целый класс
    # post-exploitation атак (нельзя дропнуть бинарь в /, нельзя залить веб-шелл).
    # /app/data остаётся writable через volume выше.
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    # Лимиты, чтобы один процесс не съел всю VPS. 512M с запасом на пики —
    # сервер сигналинговый, в норме держится в 50-100M.
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
        reservations:
          memory: 128M
    # Ротация логов — без неё `docker logs` растёт неограниченно, а при
    # перезапуске обнуляется. 10MB × 5 файлов = 50MB на контейнер.
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  # ===========================================================================
  # TURN-сервер (опциональный). Поднимается ТОЛЬКО с `--profile turn`:
  #   docker compose --profile turn up -d --build
  # Без флага сервис не стартует — проект работает только со STUN, как раньше.
  # Нужен для пользователей за симметричным NAT / CG-NAT (мобильные сети,
  # некоторые домашние провайдеры). См. tasks/turn-plan.md.
  # ===========================================================================
  coturn:
    profiles: ["turn"]
    image: coturn/coturn:4.6-alpine
    container_name: void-coturn
    restart: unless-stopped
    # network_mode: host — coturn анонсирует свой IP в ICE-candidates через
    # --external-ip. Через docker NAT он бы анонсировал внутренний IP сети, и
    # клиенты не смогли бы достучаться. На host-сети это решается естественно:
    # coturn слушает 3478/udp и 49152-49251/udp прямо на хосте.
    # Нужно открыть эти порты в firewall'е VPS (см. README).
    network_mode: host
    volumes:
      - ./coturn/turnserver.conf:/etc/coturn/turnserver.conf:ro
    # secrets, realm и сетевые адреса — через CLI-флаги. Они привязаны к
    # окружению (свой IP на каждом VPS), а turnserver.conf статичен и под git.
    # --listening-ip / --relay-ip — без них coturn рекламирует ВСЕ интерфейсы
    # хоста (включая docker-bridges 172.17.0.1, 172.18.0.1...), и клиент
    # получает мусорные relay-кандидаты, которые ниоткуда не достижимы.
    command: >
      -c /etc/coturn/turnserver.conf
      --static-auth-secret=${TURN_SECRET}
      --realm=${TURN_REALM:-void-room.space}
      --external-ip=${TURN_EXTERNAL_IP}
      --listening-ip=${TURN_EXTERNAL_IP}
      --relay-ip=${TURN_EXTERNAL_IP}
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.3"
        reservations:
          memory: 64M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
