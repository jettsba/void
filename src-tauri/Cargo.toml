[package]
name = "void-desktop"
version = "0.12.14"
description = "Void — эфемерные P2P голосовые комнаты"
authors = ["Void"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "void_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "devtools"] }
tauri-plugin-shell = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-notification = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-updater = "2"
tokio = { version = "1", features = ["time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png"] }

# Native Windows API для отключения communications-ducking (см. audio_session.rs).
# Когда у юзера в Windows Control Panel → Sound → Communications стоит дефолтное
# "Reduce volume by 80%" — каждый раз когда юзер говорит в mic, Windows душит ВСЕ
# audio sources на 80%. В голос-чатах со скрин-демкой это даёт классический баг
# Discord/Zoom: "музыка приглушается когда говорю". Через IAudioSessionControl2::
# SetDuckingPreference(true) на наших аудио-сессиях говорим Windows не дакать.
[target.'cfg(windows)'.dependencies]
# winreg — re-assert указателя «Удалить» на кастомный деинсталлятор (Веха B),
# т.к. тихий NSIS-апдейт сбивает UninstallString обратно на свой uninstall.exe.
winreg = "0.52"
# webview2-com — прямой доступ к ICoreWebView2 для авто-грантa разрешения на
# микрофон (PermissionRequested), чтобы не всплывал нативный виндовый промпт
# «tauri.localhost хочет использовать микрофон». Версия синхронна с той, что
# тянет wry (см. Cargo.lock) — иначе разъедутся COM-типы Microsoft::*.
webview2-com = "0.38"
# windows-core — нужен для макроса #[implement] (реализация COM-интерфейса
# IActivateAudioInterfaceCompletionHandler в screen_audio.rs). Версия = windows.
windows-core = "0.59"
windows = { version = "0.59", features = [
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Variant",
    "Win32_Foundation",
    "Win32_System_Threading",
    # Win32_UI_WindowsAndMessaging — EnumWindows/ShowWindow/FindWindowW и пр.,
    # Win32_UI_Accessibility — SetWinEventHook (мгновенное скрытие индикатора
    # захвата без мелькания). См. screen_indicator.rs.
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Accessibility",
] }

[features]
custom-protocol = ["tauri/custom-protocol"]
