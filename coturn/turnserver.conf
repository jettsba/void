# coturn config for void-room.
# Только то, что реально нужно. Остальное — дефолты coturn.
# static-auth-secret и realm подкидываются через CLI-флаги из env (см. docker-compose.yml),
# чтобы не держать секреты в файле под git.

listening-port=3478
fingerprint
lt-cred-mech
use-auth-secret

# Узкий range портов для relay. Каждый relay-allocation берёт пару портов из range.
# 100 портов = 50 одновременных relay-пар. Под наш масштаб (5 одновременных юзеров
# в комнате, mesh-лимит) с запасом на параллельные комнаты — комфортно для 1к DAU.
# Если упрёмся — расширить + одновременно расширить firewall-правило.
min-port=49152
max-port=49251

# Запрет relay в приватные сети — anti-SSRF / anti-DDoS-amplification (классическая
# дыра открытых TURN: атакующий шлёт через TURN в localhost / AWS-metadata / соседние
# RFC1918-сети и т.п.). Список — bogon-ranges по RFC 6890 + AWS metadata + multicast.
no-multicast-peers
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.0.2.0-192.0.2.255
denied-peer-ip=192.88.99.0-192.88.99.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=198.51.100.0-198.51.100.255
denied-peer-ip=203.0.113.0-203.0.113.255
denied-peer-ip=240.0.0.0-255.255.255.255

# Лимиты per-allocation, anti-abuse. Цифры — с запасом на voice + screencast.
# Голос (Opus) ≤ 64 kbps, screencast video после клиентского cap ≤ 800 kbps.
# Ставим 1500000 (1.5 Mbps) на сессию — головоломки не будет, abuse — отрубится.
user-quota=12
total-quota=1200
max-bps=1500000
bps-capacity=120000000

# UDP-only по дефолту. TCP/TLS — если потом понадобится для блокированных сетей.
no-tcp-relay

# Логи — только в stdout. Docker сам собирает их в `docker logs void-coturn`,
# log rotation уже настроен в docker-compose.yml (10MB × 3 файла).
# File-logging не используем: coturn внутри контейнера работает под uid 999,
# bind-mount папки от хоста (uid 1000) даёт EACCES при попытке записи.
simple-log

# Отключаем неиспользуемые поверхности.
# ВАЖНО: coturn НЕ парсит inline-комментарии после boolean-ключей —
# пишет «Unknown boolean value: # ...» и падает. Поэтому комментарии только
# на отдельных строках над ключами, никогда после.

# Отключаем management CLI-порт (5766) — он нам не нужен.
no-cli

# Отрубаем устаревшие версии TLS (на случай если когда-то поднимем turns://).
no-tlsv1
no-tlsv1_1
