name: Deploy

# Триггер: пуш в main. Деплоит всю кодовую базу на VPS через docker-compose.
# Старая рассинка фронта на timeweb убрана — продакшн давно на VPS + Caddy.
#
# Требуемые secrets (Repo Settings → Secrets and variables → Actions):
#   DEPLOY_SSH_KEY  — приватный ключ от dedicated deploy-юзера (см. tasks/todo.md)
#   DEPLOY_HOST     — IP/host VPS (например 5.129.220.29)
#   DEPLOY_USER     — пользователь для SSH (например root)

on:
  push:
    branches:
      - main
  # Кнопка «Run workflow» в UI на случай ручного передеплоя без коммита.
  workflow_dispatch:

# Запрещаем параллельные деплои: если пуш прилетел во время прошлого деплоя,
# новый встаёт в очередь и отменяет предыдущий — на сервере не должно быть
# двух конкурентных `docker compose up --build` подряд.
concurrency:
  group: deploy-vps
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Trust server host key
        # ssh-keyscan на лету — простой вариант. Если нужна защита от MITM
        # на первом запуске — заменить на статический fingerprint в secret.
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Pull and rebuild on VPS
        # `--profile turn` поднимает coturn (опциональный сервис) вместе с void.
        # Без флага coturn остаётся жить со старым конфигом — правки в
        # coturn/turnserver.conf или в docker-compose.yml-секции coturn не
        # подтянутся при пуше. На проде TURN включён всегда, поэтому профиль
        # активируем безусловно. Если нужно временно отключить TURN — убрать
        # `TURN_HOST`/`TURN_SECRET` из .env на сервере: тогда compose поднимет
        # coturn, но он упадёт с понятной ошибкой, а Node-endpoint /api/turn-
        # credentials начнёт отдавать 503 и клиент сам перейдёт в STUN-only.
        #
        # Caddyfile sync: Caddy читает /etc/caddy/Caddyfile, а в репо лежит
        # ~/void/Caddyfile. Без sync'а правки Caddyfile (новые домены, security
        # headers, редиректы) тихо не доходили до прода — приходилось руками
        # cp+reload и забывать про это. Сравниваем cmp'ом (без sudo, файл
        # обычно 644); если различаются — копируем и reload'им. Идемпотентно:
        # при неизменном Caddyfile никаких side-effects. Для root-юзера sudo
        # это no-op; для отдельного deploy-юзера нужен sudoers entry
        # (см. README или попроси Claude сгенерировать).
        run: |
          ssh "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            'set -euo pipefail
             cd ~/void
             git pull --ff-only

             if ! cmp -s ~/void/Caddyfile /etc/caddy/Caddyfile 2>/dev/null; then
               echo "Caddyfile changed, syncing..."
               sudo cp ~/void/Caddyfile /etc/caddy/Caddyfile
               sudo systemctl reload caddy
               echo "Caddy reloaded"
             else
               echo "Caddyfile unchanged"
             fi

             docker compose --profile turn up -d --build
             docker image prune -f'

      - name: Ping IndexNow (Bing + Yandex)
        # IndexNow — открытый протокол от Bing и Yandex для push-уведомления
        # поисковиков о новых/изменённых URL. Без него Bing/Yandex реагируют
        # на правки 1-2 недели; с ним — обычно 1-2 дня. Google IndexNow не
        # использует, для него — Search Console.
        #
        # Ключ — публичный токен (не секрет), лежит в landing/<key>.txt и в
        # этом workflow. Меняется через регенерацию обоих мест синхронно.
        # API rate-limit ~10k URL/день/хост — наши 4 URL влезают без проблем.
        # Шлём на каждый деплой; IndexNow не наказывает за лишние ping'и.
        if: success()
        run: |
          curl -fsS -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d '{
              "host": "void-room.space",
              "key": "9a613f86280d93bde756b725d1737563",
              "keyLocation": "https://void-room.space/9a613f86280d93bde756b725d1737563.txt",
              "urlList": [
                "https://void-room.space/",
                "https://void-room.space/en/",
                "https://void-room.space/privacy",
                "https://void-room.space/en/privacy"
              ]
            }' || echo "IndexNow ping failed (non-fatal)"
