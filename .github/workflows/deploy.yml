name: Deploy

# Триггер: пуш в main. Деплоит всю кодовую базу на VPS через docker-compose.
# Старая рассинка фронта на timeweb убрана — продакшн давно на VPS + Caddy.
#
# Требуемые secrets (Repo Settings → Secrets and variables → Actions):
#   DEPLOY_SSH_KEY  — приватный ключ от dedicated deploy-юзера (см. tasks/todo.md)
#   DEPLOY_HOST     — IP/host VPS (например 5.129.220.29)
#   DEPLOY_USER     — пользователь для SSH (например root)

on:
  push:
    branches:
      - main
  # Кнопка «Run workflow» в UI на случай ручного передеплоя без коммита.
  workflow_dispatch:

# Запрещаем параллельные деплои: если пуш прилетел во время прошлого деплоя,
# новый встаёт в очередь и отменяет предыдущий — на сервере не должно быть
# двух конкурентных `docker compose up --build` подряд.
concurrency:
  group: deploy-vps
  cancel-in-progress: true

jobs:
  # Unit-тесты (node:test, без зависимостей — npm install не нужен): сервер,
  # приватность логов, закрытие комнаты, токен выхода, синхронность версий.
  # Деплой ждёт их — сломанная логика комнат не уезжает на прод.
  # e2e (Playwright, два браузера) — локально: `npm run test:e2e`.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Unit tests
        run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Trust server host key
        # ssh-keyscan на лету — простой вариант. Если нужна защита от MITM
        # на первом запуске — заменить на статический fingerprint в secret.
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Pull and (conditionally) rebuild on VPS
        # `--profile turn` поднимает coturn (опциональный сервис) вместе с void.
        # Без флага coturn остаётся жить со старым конфигом — правки в
        # coturn/turnserver.conf или в docker-compose.yml-секции coturn не
        # подтянутся при пуше. На проде TURN включён всегда, поэтому профиль
        # активируем безусловно. Если нужно временно отключить TURN — убрать
        # `TURN_HOST`/`TURN_SECRET` из .env на сервере: тогда compose поднимет
        # coturn, но он упадёт с понятной ошибкой, а Node-endpoint /api/turn-
        # credentials начнёт отдавать 503 и клиент сам перейдёт в STUN-only.
        #
        # Caddyfile sync: Caddy читает /etc/caddy/Caddyfile, а в репо лежит
        # ~/void/Caddyfile. Без sync'а правки Caddyfile (новые домены, security
        # headers, редиректы) тихо не доходили до прода — приходилось руками
        # cp+reload и забывать про это. Сравниваем cmp'ом (без sudo, файл
        # обычно 644); если различаются — копируем и reload'им. Идемпотентно:
        # при неизменном Caddyfile никаких side-effects. Для root-юзера sudo
        # это no-op; для отдельного deploy-юзера нужен sudoers entry
        # (см. README или попроси Claude сгенерировать). reload у Caddy
        # graceful — живые соединения его переживают.
        #
        # УМНЫЙ ГЕЙТ ПЕРЕСБОРКИ. Рестарт контейнера = смерть сигналинга = всех
        # выкидывает из активных комнат. Но фронт (public/, landing/) с этого
        # коммита примонтирован bind-mount'ом и читается с диска на каждый
        # запрос — чтобы такая правка доехала, процесс трогать НЕ НАДО.
        # Поэтому пересобираем, только если задет server-side код.
        # package.json в списке НЕТ намеренно: бамп версии подхватывается
        # лениво (hot() в server.js), а реальная смена зависимостей всегда
        # меняет package-lock.json. Ручной workflow_dispatch (или любой прогон
        # без новых коммитов) пересобирает всегда — escape hatch.
        # ServerAliveInterval: раннеры GitHub живут в Azure, а там NAT рвёт
        # TCP после ~4 мин тишины. Деплой 2026-10-11 молча ждал reload Caddy
        # 7.5 мин и умер с «Broken pipe» на 4:45 — посреди скрипта.
        run: |
          ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=10 \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            'set -euo pipefail
             cd ~/void
             # Деплой-копия — ЧИСТОЕ зеркало origin/main. Раньше тут был
             # `git pull --ff-only`: он падал ("Not possible to fast-forward"),
             # как только на VPS заводился локальный коммит / история расходилась
             # — и блокировал весь деплой на первом шаге. fetch + reset --hard
             # всегда приводит рабочую копию ровно к origin/main и самоисцеляет
             # дивергенцию. БЕЗОПАСНО: runtime-состояние (data/, .env) —
             # untracked/gitignored, reset --hard их не трогает; tracked-файлы и
             # так обязаны совпадать с origin. git clean НЕ зовём — он снёс бы
             # data/ и .env.
             # Дифф считаем от последнего УСПЕШНО задеплоенного коммита
             # (.deployed-sha пишется в самом конце скрипта), а не от HEAD:
             # упавший посреди деплой уже сделал reset, и следующий прогон
             # иначе не увидел бы серверных правок — контейнер так и остался
             # бы старым. Нет файла → BEFORE пуст → полная пересборка.
             BEFORE=$(cat .deployed-sha 2>/dev/null || echo "")
             git fetch origin main
             git reset --hard origin/main
             AFTER=$(git rev-parse HEAD)

             # Сначала валидируем УСТАНОВЛЕННЫМ бинарником. Caddyfile требует
             # модуль layer4 (TURN по TLS на 443), которого нет в apt-сборке:
             # без проверки мы бы положили в /etc/caddy файл, на котором reload
             # упадёт, а следующий рестарт Caddy не поднимет сайт вовсе. Невалидный
             # файл НЕ синкаем, деплой продолжается — сайт живёт на прежнем конфиге.
             if ! cmp -s ~/void/Caddyfile /etc/caddy/Caddyfile 2>/dev/null; then
               if sudo caddy validate --adapter caddyfile --config ~/void/Caddyfile >/tmp/caddy-validate.log 2>&1; then
                 echo "Caddyfile changed, syncing..."
                 sudo cp ~/void/Caddyfile /etc/caddy/Caddyfile
                 # --no-block: reload ждёт, пока старый конфиг отпустит активные
                 # соединения (grace_period в Caddyfile) — деплою ждать незачем.
                 sudo systemctl reload --no-block caddy
                 echo "Caddy reload queued"
               else
                 echo "::warning::Caddyfile NOT synced: installed caddy rejects it (layer4 build missing?)"
                 tail -n 3 /tmp/caddy-validate.log
               fi
             else
               echo "Caddyfile unchanged"
             fi

             REBUILD=yes
             RECREATE_TURN=no
             if [ -n "$BEFORE" ] && [ "$BEFORE" != "$AFTER" ]; then
               CHANGED=$(git diff --name-only "$BEFORE" "$AFTER")
               echo "--- changed files ---"
               echo "$CHANGED"
               echo "---------------------"
               if echo "$CHANGED" | grep -qE "^(server\.js|lib/|Dockerfile|docker-compose\.yml|docker-entrypoint\.sh|package-lock\.json)"; then
                 REBUILD=yes
               else
                 REBUILD=no
               fi
               # turnserver.conf примонтирован бинд-маунтом: его содержимое меняется
               # на диске, а описание контейнера — нет, поэтому обычный `up -d` coturn
               # НЕ пересоздаёт и он молча доживает со старым конфигом. Ровно тот
               # случай, когда деплой «прошёл», а правка не применилась.
               if echo "$CHANGED" | grep -qE "^coturn/"; then
                 RECREATE_TURN=yes
               fi
             fi

             # Страховка: контейнера нет (первый деплой, упал, был снесён руками)
             # — поднимаем независимо от диффа.
             if [ -z "$(docker compose ps -q void 2>/dev/null || true)" ]; then
               echo "void container is not running -> forcing rebuild"
               REBUILD=yes
             fi

             if [ "$REBUILD" = yes ]; then
               echo "server-side changed -> rebuilding container"
               docker compose --profile turn up -d --build
               docker image prune -f
             else
               echo "front-only change -> container left running (zero signalling downtime)"
             fi

             if [ "$RECREATE_TURN" = yes ]; then
               echo "coturn config changed -> recreating coturn"
               docker compose --profile turn up -d --force-recreate coturn || \
                 echo "coturn not running here (no TURN profile on this host) - skipped"
             fi

             echo "$AFTER" > .deployed-sha'

      - name: Read version
        id: ver
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Ping IndexNow (Bing + Yandex)
        # IndexNow — открытый протокол от Bing и Yandex для push-уведомления
        # поисковиков о новых/изменённых URL. Без него Bing/Yandex реагируют
        # на правки 1-2 недели; с ним — обычно 1-2 дня. Google IndexNow не
        # использует, для него — Search Console.
        #
        # Ключ — публичный токен (не секрет), лежит в landing/<key>.txt и в
        # этом workflow. Меняется через регенерацию обоих мест синхронно.
        # API rate-limit ~10k URL/день/хост — наши 4 URL влезают без проблем.
        # Шлём на каждый деплой; IndexNow не наказывает за лишние ping'и.
        if: success()
        run: |
          curl -fsS -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d '{
              "host": "void-room.space",
              "key": "9a613f86280d93bde756b725d1737563",
              "keyLocation": "https://void-room.space/9a613f86280d93bde756b725d1737563.txt",
              "urlList": [
                "https://void-room.space/",
                "https://void-room.space/en/",
                "https://void-room.space/privacy",
                "https://void-room.space/en/privacy"
              ]
            }' || echo "IndexNow ping failed (non-fatal)"

  # Desktop-релиз (Windows + macOS) — джобы release-check / build-* /
  # publish-desktop ниже. Idempotent по тегу desktop-v{version}: push без
  # bump'а версии — только web, с bump'ом — выкатывает и desktop.
  # ============================================================================
  # Компиляционный сторож для Rust-части.
  #
  # Зачем отдельно от build-desktop: та собирается ТОЛЬКО когда для текущей
  # версии ещё нет релиза, то есть фактически на бампе. Правки в src-tauri
  # внутри батча (без бампа) не компилировались вообще НИ РАЗУ — ошибка
  # всплывала на выкатке, посреди холодной 60-90-минутной сборки, в самый
  # неудачный момент. Здесь то же самое проверяется на каждом пуше, который
  # трогает Rust.
  #
  # `cargo check`, а не build: он доводит код до проверки типов и не линкует —
  # в разы быстрее, а ловит ровно тот класс ошибок, ради которого ставится.
  # Проверяем все ТРИ крейта: приложение, деинсталлятор и установщик собираются
  # только на релизе, значит и молчат до релиза одинаково. Установщик к тому же
  # чекается на чистом клоне без вшитого payload — его build.rs сам кладёт
  # пустой placeholder (см. installer/src-tauri/build.rs).
  #
  # Rust на раннерах предустановлен — отдельный setup-шаг не нужен.
  #
  # Две ОС: Windows (все три крейта) и macOS (только приложение — установщик и
  # деинсталлятор там не собираются). Половина кода в lib.rs разведена
  # cfg(windows)/cfg(target_os = "macos"), и ветку, которую не компилировали,
  # иначе ловил бы только релиз.
  # ============================================================================
  check-desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          # Нужна история: сравниваем пуш с его предшественником, чтобы не
          # гонять чек на пушах, которые Rust не трогают.
          fetch-depth: 0

      - name: Detect Rust changes
        id: detect
        shell: bash
        run: |
          before="${{ github.event.before }}"
          # workflow_dispatch, первый пуш в ветку, force-push — предшественника
          # может не быть или он мог исчезнуть. Тогда проверяем, а не гадаем:
          # лишний прогон дешевле пропущенной ошибки.
          if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$before^{commit}" 2>/dev/null; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "no usable base commit - checking anyway"
            exit 0
          fi
          if git diff --name-only "$before" "${{ github.sha }}" \
             | grep -qE '^(src-tauri|installer/src-tauri|uninstaller/src-tauri)/'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "rust touched - checking"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "no rust changes - skipping"
          fi

      - name: Cache cargo (check)
        if: steps.detect.outputs.changed == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
            installer/src-tauri/target
            uninstaller/src-tauri/target
          # Свой префикс ключа: у build-desktop в target/ полноценные release-
          # артефакты, у нас только метаданные проверки. С общим ключом они бы
          # затирали кэш друг другу и обе джобы всегда стартовали холодными.
          key: cargo-check-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.lock', 'installer/src-tauri/Cargo.lock', 'uninstaller/src-tauri/Cargo.lock') }}
          restore-keys: |
            cargo-check-${{ runner.os }}-

      - name: Stub bundled resources
        if: steps.detect.outputs.changed == 'true' && runner.os == 'Windows'
        # tauri.conf.json главного приложения объявляет ресурсом
        # `bundled/void-uninstaller.exe`, а он под .gitignore — в чистом клоне
        # его НЕТ, и build.rs падает ещё до компиляции:
        # «resource path doesn't exist». Релизная сборка кладёт туда настоящий
        # деинсталлятор первым шагом трёхстадийной сборки; проверке собирать
        # его незачем — tauri-build валидирует НАЛИЧИЕ пути, а не содержимое
        # (проверено: с пустым файлом build.rs проходит).
        #
        # ВАЖНО: заглушка живёт только в этой джобе. В релизном пути её быть не
        # должно — пустышка молча уехала бы в бандл вместо рабочего
        # деинсталлятора. Поэтому и не в build.rs: там она сломала бы релиз
        # тихо, а не громко.
        #
        # У installer-крейта та же история с payload/void_setup.exe, но он
        # закрывает её сам (installer/src-tauri/build.rs кладёт placeholder).
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p src-tauri/bundled
          if [ ! -f src-tauri/bundled/void-uninstaller.exe ]; then
            : > src-tauri/bundled/void-uninstaller.exe
            echo "created check-only placeholder for bundled/void-uninstaller.exe"
          fi

      - name: cargo check (app, uninstaller, installer)
        if: steps.detect.outputs.changed == 'true'
        # ИМЕННО bash, не pwsh: в PowerShell упавшая нативная команда не
        # останавливает скрипт, и код возврата шага берётся от ПОСЛЕДНЕЙ. Ошибка
        # в первом крейте молча утонула бы за успехом третьего.
        # Без --locked: Cargo.lock в репо отстаёт по версии пакета от Cargo.toml
        # (её бампает выкатка, лок не трогает), и --locked отказался бы работать.
        shell: bash
        run: |
          set -euo pipefail
          cargo check --manifest-path src-tauri/Cargo.toml
          if [ "$RUNNER_OS" = "Windows" ]; then
            cargo check --manifest-path uninstaller/src-tauri/Cargo.toml
            cargo check --manifest-path installer/src-tauri/Cargo.toml
          fi


  # ============================================================================
  # Desktop-релиз: Windows + macOS одной версией.
  #
  #   release-check ─┬─ build-windows ─┐
  #                  └─ build-macos  ──┴─ publish-desktop
  #
  # Сборки идут параллельно на своих раннерах и только сдают файлы
  # артефактами. Релиз, манифест апдейтера и зеркало /dl делает ОДНА джоба
  # после обеих: у версии всегда полный набор платформ. Упала одна сборка —
  # релиза нет вовсе, и следующий прогон соберёт обе заново (идемпотентность по
  # тегу та же). Иначе latest.json вышел бы без одной из платформ, а тег уже
  # занят — повторить сборку недостающей было бы нечем.
  # ============================================================================
  release-check:
    runs-on: ubuntu-latest
    needs: deploy
    timeout-minutes: 5
    outputs:
      version: ${{ steps.ver.outputs.version }}
      tag: ${{ steps.ver.outputs.tag }}
      exists: ${{ steps.check.outputs.exists }}
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: ver
        run: |
          v=$(node -p "require('./package.json').version")
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "tag=desktop-v$v" >> "$GITHUB_OUTPUT"

      # Idempotent: если для версии package.json уже выпущен релиз с тегом
      # desktop-v{version} — сборки пропускаются. Пуш без бампа = только web.
      - name: Check if release already exists
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${{ steps.ver.outputs.tag }}" --repo jettsba/void >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release ${{ steps.ver.outputs.tag }} already exists — skipping build."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Release ${{ steps.ver.outputs.tag }} not found — building."
          fi

  build-windows:
    runs-on: windows-latest
    # Гейт: сначала компиляционный сторож, потом полуторачасовая сборка.
    # Иначе ошибка Rust жгла бы 40+ минут раннера, чтобы упасть на том же.
    needs: [release-check, check-desktop]
    if: needs.release-check.outputs.exists == 'false'
    # Холодная сборка ТРЁХ независимых Tauri-крейтов (uninstaller → app →
    # installer), каждый в своём target/ — на Windows-раннере это ~60-90 мин с
    # нуля. 30 мин не хватало: джоба убивалась таймаутом, не успев сохранить
    # кэш → следующий прогон снова холодный → вечный таймаут. Запас даёт
    # одному холодному прогону доехать и наполнить кэш; дальше restore-keys
    # (см. шаг кэша) делает сборки инкрементальными и быстрыми.
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
            installer/src-tauri/target
            uninstaller/src-tauri/target
          # Ключ покрывает ВСЕ три lock-файла — иначе смена deps в installer/
          # uninstaller не инвалидировала бы кэш. restore-keys критичен: при
          # смене любого lock (как winreg в src-tauri в Вехе B) точный ключ
          # промахивается, и БЕЗ fallback'а всё компилилось бы с нуля и упиралось
          # в таймаут. С restore-keys восстанавливается ближайший прошлый кэш как
          # тёплая база → cargo пересобирает только изменившееся, инкрементально.
          key: cargo-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.lock', 'installer/src-tauri/Cargo.lock', 'uninstaller/src-tauri/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: npm install
        run: npm ci

      - name: Verify signing secrets present
        shell: pwsh
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          PASS: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          $keyLen = if ($env:KEY) { $env:KEY.Length } else { 0 }
          $passLen = if ($env:PASS) { $env:PASS.Length } else { 0 }
          Write-Host "TAURI_SIGNING_PRIVATE_KEY length: $keyLen"
          Write-Host "TAURI_SIGNING_PRIVATE_KEY_PASSWORD length: $passLen"
          if ($keyLen -lt 100) {
            Write-Error "TAURI_SIGNING_PRIVATE_KEY is missing or too short. Add the secret in repo Settings → Secrets → Actions."
            exit 1
          }

      - name: Build custom uninstaller (Веха B) + stage as app resource
        shell: pwsh
        run: |
          # Деинсталлятор собираем ПЕРВЫМ и кладём в src-tauri/bundled/, откуда
          # главное приложение вшивает его в bundle.resources (NSIS ставит его в
          # папку установки). См. tasks/installer-plan.md (Фаза 6).
          cargo build --release --manifest-path uninstaller/src-tauri/Cargo.toml
          New-Item -ItemType Directory -Force src-tauri/bundled | Out-Null
          Copy-Item "uninstaller/src-tauri/target/release/void-uninstaller.exe" `
                    "src-tauri/bundled/void-uninstaller.exe" -Force

      - name: Build + sign
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          RAW_PASS: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          # GitHub Secrets UI не разрешает пустое значение, поэтому юзер
          # вынужден поставить пробел. Tauri читает его буквально как
          # пароль " " и фейлит декодинг ключа без пароля. Trim'им и если
          # осталось пусто — удаляем env var вообще, тогда Tauri решит
          # что ключ без пароля.
          $pass = if ($env:RAW_PASS) { $env:RAW_PASS.Trim() } else { "" }
          if ($pass.Length -gt 0) {
            $env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD = $pass
            Write-Host "using password from secret (length: $($pass.Length))"
          } else {
            Remove-Item Env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD -ErrorAction SilentlyContinue
            Write-Host "password empty/whitespace — signing without password"
          }
          Remove-Item Env:RAW_PASS -ErrorAction SilentlyContinue
          npm run tauri:build

      - name: List bundle output (diagnostic)
        shell: pwsh
        run: |
          Write-Host "=== bundle/ contents ==="
          Get-ChildItem -Recurse src-tauri/target/release/bundle/ -ErrorAction SilentlyContinue |
            Select-Object FullName, Length |
            Format-Table -AutoSize | Out-String -Width 200 | Write-Host
          Write-Host "=== .sig files anywhere in target/release ==="
          Get-ChildItem -Recurse src-tauri/target/release/ -Filter "*.sig" -ErrorAction SilentlyContinue |
            Select-Object FullName, Length |
            Format-Table -AutoSize | Out-String -Width 200 | Write-Host

      - name: Build custom installer (single-file, embeds NSIS)
        shell: pwsh
        run: |
          # Веха A: вшиваем свежесобранный NSIS-setup в кастомный установщик и
          # собираем одиночный void_installer.exe (для людей; апдейтер и дальше
          # тянет void_setup.exe). См. tasks/installer-plan.md (Фазы 4-5).
          New-Item -ItemType Directory -Force installer/src-tauri/payload | Out-Null
          Copy-Item "src-tauri/target/release/bundle/nsis/void_setup.exe" `
                    "installer/src-tauri/payload/void_setup.exe" -Force
          cargo build --release --manifest-path installer/src-tauri/Cargo.toml
          Copy-Item "installer/src-tauri/target/release/void-installer.exe" `
                    "installer/src-tauri/target/release/void_installer.exe" -Force
          $sz = (Get-Item "installer/src-tauri/target/release/void_installer.exe").Length
          Write-Host "void_installer.exe size: $sz bytes"

      - name: Stage release files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp installer/src-tauri/target/release/void_installer.exe \
             src-tauri/target/release/void_portable.exe \
             src-tauri/target/release/bundle/nsis/void_setup.exe \
             src-tauri/target/release/bundle/nsis/void_setup.exe.sig \
             dist/
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-windows
          path: dist/
          if-no-files-found: error
          retention-days: 3

  # macOS: universal-бинарь (Apple Silicon + Intel одним .app). Без сертификата
  # Apple: подпись САМОПОДПИСАННЫМ сертификатом (секреты APPLE_CERTIFICATE*),
  # без нотаризации — Gatekeeper на первом запуске всё равно спросит, но
  # подпись стабильна между версиями, и macOS не сбрасывает выданные
  # разрешения (микрофон, запись экрана) после каждого автообновления: у ad-hoc
  # подписи «личность» = хеш бинаря, а он у каждой версии свой.
  build-macos:
    runs-on: macos-latest
    needs: [release-check, check-desktop]
    if: needs.release-check.outputs.exists == 'false'
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: cargo-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: npm install
        run: npm ci

      - name: Verify signing secrets present
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          CERT: ${{ secrets.APPLE_CERTIFICATE }}
          CERT_PASS: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          fail=0
          [ ${#KEY} -ge 100 ] || { echo "::error::TAURI_SIGNING_PRIVATE_KEY is missing or too short"; fail=1; }
          [ ${#CERT} -ge 100 ] || { echo "::error::APPLE_CERTIFICATE (base64 .p12) is missing — see docs/DEVELOPMENT.md"; fail=1; }
          [ -n "$CERT_PASS" ] || { echo "::error::APPLE_CERTIFICATE_PASSWORD is missing"; fail=1; }
          exit $fail

      # Свой keychain с сертификатом, добавленный в поиск. Сертификат НЕ
      # доверенный (самоподписанный), поэтому через APPLE_CERTIFICATE Tauri его
      # не найдёт (`find-identity -v` показывает только доверенные). А с одним
      # APPLE_SIGNING_IDENTITY Tauri зовёт `codesign -s "void desktop"` как
      # есть — codesign доверия к сертификату не требует.
      - name: Import code signing certificate
        env:
          CERT: ${{ secrets.APPLE_CERTIFICATE }}
          CERT_PASS: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          kc="$RUNNER_TEMP/void-signing.keychain-db"
          kp="$(openssl rand -hex 16)"
          security create-keychain -p "$kp" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$kp" "$kc"
          printf '%s' "$CERT" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$kc" -P "$CERT_PASS" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$kp" "$kc" >/dev/null
          existing=()
          while IFS= read -r line; do
            line="${line//\"/}"; line="${line#"${line%%[![:space:]]*}"}"
            [ -n "$line" ] && existing+=("$line")
          done < <(security list-keychains -d user)
          security list-keychains -d user -s "$kc" "${existing[@]}"
          security find-identity -p codesigning "$kc"

      - name: Build + sign (universal)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          RAW_PASS: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_SIGNING_IDENTITY: void desktop
        run: |
          set -euo pipefail
          # Пароль ключа апдейтера: пробел из UI секретов срезаем (см. тот же шаг
          # в build-windows), но переменную экспортируем ВСЕГДА, даже пустой —
          # без неё Tauri на маке молча не подписывает Void.app.tar.gz
          # (проверено: архив есть, .sig нет, сборка «зелёная»).
          export TAURI_SIGNING_PRIVATE_KEY_PASSWORD="$(printf '%s' "${RAW_PASS:-}" | xargs)"
          unset RAW_PASS
          npx tauri build --target universal-apple-darwin

      - name: Verify app signature
        run: |
          set -euo pipefail
          app="src-tauri/target/universal-apple-darwin/release/bundle/macos/Void.app"
          codesign --verify --strict --deep "$app"
          req="$(codesign -dr - "$app" 2>&1)"
          echo "$req"
          # Стабильная «личность» = корень сертификата. ad-hoc (cdhash) здесь —
          # значит, подпись тихо не применилась.
          echo "$req" | grep -q 'certificate root' || { echo "::error::app is not signed with the void certificate"; exit 1; }
          lipo -archs "$app/Contents/MacOS/void-desktop"

      # DMG собирает dmgbuild, а не bundler Tauri: тот оформляет окно через
      # AppleScript к Finder, а Finder без видимой сессии молча теряет фон и
      # позиции иконок. Подробности — src-tauri/macos/dmg-settings.py.
      - name: Build DMG
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/dmgbuild"
          "$RUNNER_TEMP/dmgbuild/bin/pip" install --quiet dmgbuild==1.6.5
          mkdir -p dist
          "$RUNNER_TEMP/dmgbuild/bin/dmgbuild" -s src-tauri/macos/dmg-settings.py \
            -D app="src-tauri/target/universal-apple-darwin/release/bundle/macos/Void.app" \
            Void dist/void.dmg

      - name: Stage release files
        run: |
          set -euo pipefail
          b="src-tauri/target/universal-apple-darwin/release/bundle/macos"
          cp "$b/Void.app.tar.gz" dist/void_macos.app.tar.gz
          cp "$b/Void.app.tar.gz.sig" dist/void_macos.app.tar.gz.sig
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-macos
          path: dist/
          if-no-files-found: error
          retention-days: 3

  publish-desktop:
    runs-on: ubuntu-latest
    needs: [release-check, build-windows, build-macos]
    timeout-minutes: 20
    permissions:
      contents: write  # релиз идёт в ЭТОТ же репо → хватает встроенного GITHUB_TOKEN
    env:
      # Основной репо теперь публичный → отдельный релизный репо больше не нужен,
      # релизы идут сюда же. Анонимный доступ к release-URL работает (нужен
      # апдейтеру и кнопкам лендинга без авторизации). Бинарники к тому же
      # дублируются на свой домен (/dl) — см. шаг «Upload artifacts to VPS».
      RELEASES_REPO: jettsba/void
      TAG: ${{ needs.release-check.outputs.tag }}
      VERSION: ${{ needs.release-check.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate manifests
        env:
          RELEASE_NOTES: "Desktop release ${{ needs.release-check.outputs.tag }}"
        run: |
          set -euo pipefail
          ls -la dist
          # Два варианта: GitHub (url → releases/latest/download) и зеркало
          # (url → void-room.space/dl). Подписи одни и те же.
          node scripts/build-manifest.mjs
          MANIFEST_BASE_URL="https://void-room.space/dl" MANIFEST_OUT="latest.vps.json" \
            node scripts/build-manifest.mjs

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Описание релиза = сообщение коммита, который триггернул сборку
          # (checkout@v4 берёт именно его). Пишем в файл, чтобы корректно
          # пробросить многострочный текст и спецсимволы.
          git log -1 --pretty=%B > release_notes.txt
          gh release create "$TAG" \
            --repo "$RELEASES_REPO" \
            --title "void desktop v$VERSION" \
            --notes-file release_notes.txt \
            --latest \
            --target main \
            dist/void_installer.exe \
            dist/void_setup.exe \
            dist/void_setup.exe.sig \
            dist/void_portable.exe \
            dist/void.dmg \
            dist/void_macos.app.tar.gz \
            dist/void_macos.app.tar.gz.sig \
            latest.json

      # В репо держим РОВНО ОДИН релиз — текущий. История релизов никому не нужна:
      # апдейтер ходит на releases/latest/download/latest.json (алиас последнего)
      # и на зеркало /dl, кнопки лендинга — тоже на /dl. А растущий список из
      # десятков версий только засоряет страницу репо.
      #
      # Теги чистим ТОЛЬКО по маске desktop-v* — чтобы случайный посторонний тег
      # (например, будущий релиз web-части) этот шаг не снёс.
      #
      # Ошибку удаления не считаем фатальной: релиз уже создан и залит на зеркало,
      # ронять из-за уборки зелёную сборку незачем — просто пишем warning.
      - name: Prune old releases and desktop tags (keep current)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KEEP: ${{ needs.release-check.outputs.tag }}
        run: |
          set -uo pipefail

          echo "keeping: $KEEP"

          # Релизы (включая draft'ы — они остаются, если у релиза удалили тег).
          gh api "repos/$RELEASES_REPO/releases" --paginate \
            --jq ".[] | select(.tag_name != \"$KEEP\") | \"\(.id) \(.tag_name)\"" |
          while read -r id tag; do
            [ -n "${id:-}" ] || continue
            echo "deleting release $tag (id=$id)"
            gh api -X DELETE "repos/$RELEASES_REPO/releases/$id" \
              || echo "::warning::failed to delete release $tag"
          done

          # Теги desktop-v* — всё, кроме текущего.
          gh api "repos/$RELEASES_REPO/git/refs/tags" --paginate --jq '.[].ref' 2>/dev/null |
            sed 's|refs/tags/||' |
          while read -r tag; do
            case "$tag" in desktop-v*) ;; *) continue ;; esac
            [ "$tag" != "$KEEP" ] || continue
            echo "deleting tag $tag"
            gh api -X DELETE "repos/$RELEASES_REPO/git/refs/tags/$tag" \
              || echo "::warning::failed to delete tag $tag"
          done

          echo "prune done"

      # Зеркало раздачи: дублируем артефакты на свой домен (void-room.space/dl),
      # т.к. GitHub в РФ нестабилен. Перезаписью → на сервере всегда одна,
      # последняя версия. Манифест для зеркала (url → /dl) сгенерирован выше.
      # Переиспользуем те же deploy-секреты, что и web — ничего нового, и
      # переезд на новый сервер = смена DEPLOY_HOST + DNS.
      - name: Upload artifacts to VPS mirror
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null

          SSH="ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new"
          SCP="scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new"

          $SSH "$DEPLOY_USER@$DEPLOY_HOST" 'mkdir -p /srv/void-dl'
          $SCP \
            dist/void_installer.exe \
            dist/void_portable.exe \
            dist/void_setup.exe \
            dist/void_setup.exe.sig \
            dist/void.dmg \
            dist/void_macos.app.tar.gz \
            dist/void_macos.app.tar.gz.sig \
            "$DEPLOY_USER@$DEPLOY_HOST:/srv/void-dl/"
          $SCP "latest.vps.json" "$DEPLOY_USER@$DEPLOY_HOST:/srv/void-dl/latest.json"
          # Caddy (юзер caddy) должен читать файлы и обходить каталог.
          $SSH "$DEPLOY_USER@$DEPLOY_HOST" 'chmod -R a+rX /srv/void-dl'
